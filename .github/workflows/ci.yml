name: CI

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - "deploy/helm/xo-rps/values.yaml"
      - "docs/**"
      - "infra/**"

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    outputs:
      ui_background_decision: ${{ steps.ui-background.outputs.decision }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run lint

      - name: Test
        run: npm test

      - name: Check UI background policy
        id: ui-background
        run: node scripts/check-ui-background-policy.mjs

      - name: Build
        run: npm run build

  approve-yellow-background:
    name: Await admin approval for yellow UI background
    needs: verify
    if: needs.verify.outputs.ui_background_decision == 'yellow'
    runs-on: ubuntu-latest
    environment:
      name: ui-yellow-approval
    steps:
      - name: Approved yellow UI background
        run: echo "Admin approval received for yellow UI background."
