name: CI

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - "deploy/helm/xo-rps/values.yaml"
      - "docs/**"
      - "infra/**"

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
