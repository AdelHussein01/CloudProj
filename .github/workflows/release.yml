name: Build Images and Promote with GitOps

on:
  push:
    branches:
      - main
    paths-ignore:
      - "deploy/helm/xo-rps/values.yaml"
      - "docs/**"
      - "infra/**"
      - "outputs/**"
      - "scripts/**"

permissions:
  contents: write
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  ui-background-policy:
    name: UI background policy
    runs-on: ubuntu-latest
    outputs:
      decision: ${{ steps.ui-background.outputs.decision }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Check UI background policy
        id: ui-background
        run: node scripts/check-ui-background-policy.mjs

  approve-yellow-background:
    name: Await admin approval for yellow UI background
    needs: ui-background-policy
    if: needs.ui-background-policy.outputs.decision == 'yellow'
    runs-on: ubuntu-latest
    environment:
      name: ui-yellow-approval
    steps:
      - name: Approved yellow UI background
        run: echo "Admin approval received for yellow UI background."

  release:
    name: Build, scan, push, and update Helm values
    needs:
      - ui-background-policy
      - approve-yellow-background
    if: always() && needs.ui-background-policy.result == 'success' && (needs.ui-background-policy.outputs.decision != 'yellow' || needs.approve-yellow-background.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Normalize image repository
        id: images
        shell: bash
        run: echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.images.outputs.repository }}/api:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ steps.images.outputs.repository }}/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=
          tags: |
            ${{ env.REGISTRY }}/${{ steps.images.outputs.repository }}/web:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ steps.images.outputs.repository }}/web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan API image
        id: scan-api
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.images.outputs.repository }}/api:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-api.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          scanners: vuln
          exit-code: 1

      - name: Scan web image
        id: scan-web
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.images.outputs.repository }}/web:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-web.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          scanners: vuln
          exit-code: 1

      - name: Upload API scan
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-api.sarif') != ''
        with:
          sarif_file: trivy-api.sarif
          category: trivy-api

      - name: Upload web scan
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-web.sarif') != ''
        with:
          sarif_file: trivy-web.sarif
          category: trivy-web

      - name: Archive Trivy SARIF
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-sarif-${{ github.sha }}
          path: |
            trivy-api.sarif
            trivy-web.sarif
          if-no-files-found: ignore

      - name: Evaluate Trivy security gate
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          actionable = []
          warning_count = 0
          for sarif_path in [Path("trivy-api.sarif"), Path("trivy-web.sarif")]:
              if not sarif_path.exists():
                  continue
              data = json.loads(sarif_path.read_text())
              for run in data.get("runs", []):
                  for result in run.get("results", []):
                      message = result.get("message", {}).get("text", "")
                      level = result.get("level", "")
                      is_high_or_critical = "Severity: HIGH" in message or "Severity: CRITICAL" in message
                      if level == "error" or is_high_or_critical:
                          actionable.append((sarif_path.name, result.get("ruleId", "unknown"), message.splitlines()[0]))
                      else:
                          warning_count += 1

          if actionable:
              print("Trivy found HIGH/CRITICAL findings:")
              for file_name, rule_id, summary in actionable:
                  print(f"- {file_name}: {rule_id} {summary}")
              raise SystemExit(1)

          print(f"Trivy security gate passed. Non-blocking findings: {warning_count}")
          PY

      - name: Promote image tags in GitOps values
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("deploy/helm/xo-rps/values.yaml")
          text = path.read_text()
          repo = "${{ steps.images.outputs.repository }}"
          tag = "${{ env.IMAGE_TAG }}"
          text = text.replace("ghcr.io/REPLACE_WITH_GITHUB_OWNER/REPLACE_WITH_REPO/web", f"ghcr.io/{repo}/web")
          text = text.replace("ghcr.io/REPLACE_WITH_GITHUB_OWNER/REPLACE_WITH_REPO/api", f"ghcr.io/{repo}/api")
          text = text.replace('tag: "dev"', f'tag: "{tag}"')
          lines = text.splitlines()
          in_web = False
          in_api = False
          for index, line in enumerate(lines):
              stripped = line.strip()
              if stripped == "web:":
                  in_web = True
                  in_api = False
              elif stripped == "api:":
                  in_web = False
                  in_api = True
              elif stripped and not line.startswith(" ") and stripped.endswith(":"):
                  in_web = False
                  in_api = False
              if (in_web or in_api) and stripped.startswith("tag:"):
                  lines[index] = f'    tag: "{tag}"'
          path.write_text("\n".join(lines) + "\n")
          PY

      - name: Commit GitOps promotion
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/helm/xo-rps/values.yaml
          if git diff --cached --quiet; then
            echo "No GitOps changes to promote."
          else
            git commit -m "chore(gitops): promote $IMAGE_TAG"
            git push
          fi
