{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "xo-rps.fullname" . }}-default
  labels:
    {{- include "xo-rps.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "xo-rps.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - {}
  egress:
    - {}
{{- end }}
