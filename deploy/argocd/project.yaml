apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: xo-rps
  namespace: argocd
spec:
  description: XO/RPS GitOps project
  sourceRepos:
    - https://github.com/AdelHussein01/CloudProj.git
  destinations:
    - namespace: xo-rps
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
